[project]
name = "dfine-wrapper"
version = "0.1.0"
description = "D-FINE fine-tuning for steel surface defects: one experiment.yml, weight download, best-only checkpoints, per-epoch metrics, ONNX export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # CUDA 12.8 builds (see [tool.uv.sources]); RTX 50xx needs torch >= 2.7
    "torch==2.7.1",
    "torchvision==0.22.1",
    "faster-coco-eval>=1.6.6",
    "pycocotools",         # torchvision.datasets.CocoDetection (base of the D-FINE dataset) imports it
    "pyyaml",
    "tensorboard",
    "scipy",
    "calflops",
    "transformers",        # imported by calflops
    "loguru",
    "pillow",
    "matplotlib",
    "pandas>=2,<3",        # tools/steel/infer.py returns a DataFrame; <3: Windows Smart App Control blocked a 3.0.6 DLL
    "onnx",                # tools/steel/export_onnx.py
    "onnxruntime",         # check of the export, Detector("best.onnx"); for GPU: onnxruntime-gpu instead
]

[tool.uv]
package = false            # scripts run from the repo root: train.py, tools/steel/*, *.sh
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]  # the cu128 index has no macOS wheels

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
# Tested: Windows 11, Python 3.12, RTX 5070 Ti. RTX 50xx (Blackwell) needs CUDA 12.8 builds of torch >= 2.7;
# the upstream requirements.txt (torch >= 2.0.1) works on older GPUs as well.
